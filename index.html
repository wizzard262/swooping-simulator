// ---------------------------------------------------------------------------
// Clouds: billowy pixel-art cumulus. Many round puffs, lit from the top left; lower
// puffs sit in front, so their bright tops show as billows inside the cloud.
// Colours taken from the reference picture in prompt-art/.
// ---------------------------------------------------------------------------
const CLOUD_TONES = ['#fafcff', '#e2ebfa', '#c8e2f9', '#a8d6f8', '#84d0f6', '#6cb6e8'];
const CLOUD_LIGHT = (() => { const v = [-0.45, -0.8, 0.45], m = Math.hypot(...v); return v.map(a => a / m); })();
function makeCloud(r, w, h, tower) {
  const base = h - 2, unit = clamp(h / 8, 2.5, 6), puffs = [];
  const humps = [];
  for (let i = 0, n = 2 + Math.floor(r() * 3); i < n; i++) humps.push({ x: w * (0.2 + 0.6 * r()), s: w * (0.1 + 0.14 * r()), t: 0.35 + 0.4 * r() });
  if (tower) humps.push({ x: w * (0.35 + 0.3 * r()), s: w * 0.19, t: 1 });
  const prof = x => humps.reduce((v, hp) => Math.max(v, hp.t * Math.exp(-(((x - hp.x) / hp.s) ** 2))), 0);
  const surface = x => base - unit - prof(x) * (base - 2 * unit - 1);   // height of the top puffs' centres

  for (let x = unit; x < w - unit; x += unit * (0.6 + 0.5 * r())) {     // bumpy top
    const s = surface(x);
    if (s > base - unit * 1.2 && r() < 0.4) continue;
    const rad = unit * (0.7 + 0.6 * r());
    puffs.push({ cx: x, cy: Math.min(s + rad * 0.3, base - rad * 0.4), rad });
  }
  let area = 0;
  for (let x = 0; x < w; x++) area += Math.max(0, base - surface(x));
  for (let k = 0, n = Math.round(area / (unit * unit * 2)); k < n; k++) {   // billows inside
    const x = unit + r() * (w - 2 * unit), top = surface(x);
    if (top > base - unit) continue;
    const rad = unit * (0.7 + 0.9 * r());
    let cy = top + unit + r() * (base - top - unit);
    cy = clamp(cy, top - unit * 0.3 + rad, base - rad * 0.3);
    puffs.push({ cx: x, cy, rad });
  }
  for (let x = unit; x < w - unit; x += unit * 0.9) {                   // flat base
    if (surface(x) > base - unit) continue;
    const rad = unit * (0.7 + 0.5 * r());
    puffs.push({ cx: x, cy: base - rad * 0.6, rad });
  }
  for (let k = 0, n = 2 + Math.floor(r() * 4); k < n; k++) {           // little torn-off bits
    const x = unit + r() * (w - 2 * unit), rad = 1 + r() * 1.4;
    puffs.push({ cx: x, cy: Math.max(rad, surface(x) - unit * 1.4 - r() * 3), rad });
  }
  puffs.sort((a, b) => a.cy - b.cy);

  const owner = new Int16Array(w * h).fill(-1);
  puffs.forEach((p, i) => {
    for (let y = Math.max(0, Math.floor(p.cy - p.rad)); y <= Math.min(base, Math.ceil(p.cy + p.rad)); y++)
      for (let x = Math.max(0, Math.floor(p.cx - p.rad)); x <= Math.min(w - 1, Math.ceil(p.cx + p.rad)); x++)
        if ((x + 0.5 - p.cx) ** 2 + (y + 0.5 - p.cy) ** 2 <= p.rad * p.rad) owner[y * w + x] = i;
  });
  let topY = h;
  for (let i = 0; i < w * h; i++) if (owner[i] >= 0) { topY = Math.floor(i / w); break; }

  const c = makeCanvas(w, h), g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = owner[y * w + x];
    if (i < 0) continue;
    const p = puffs[i], u = (x + 0.5 - p.cx) / p.rad, v = (y + 0.5 - p.cy) / p.rad;
    const nz = Math.sqrt(Math.max(0, 1 - u * u - v * v));
    const lam = Math.max(0, u * CLOUD_LIGHT[0] + v * CLOUD_LIGHT[1] + nz * CLOUD_LIGHT[2]);
    const depth = (y - topY) / (base - topY + 1);
    let val = lam * 1.0 + 0.3 - depth * 0.6;
    const above = y > 0 ? owner[(y - 1) * w + x] : -1, below = y < h - 1 ? owner[(y + 1) * w + x] : -1;
    if (above >= 0 && above < i) val = Math.max(val, 0.86 - depth * 0.3);  // bright rim where a billow overlaps the one behind
    if (below > i) val -= 0.12;                                             // shadow just above a billow in front
    val += (BAYER[(y & 3) * 4 + (x & 3)] / 16 - 0.47) * 0.08;
    g.fillStyle = CLOUD_TONES[val > 0.9 ? 0 : val > 0.72 ? 1 : val > 0.56 ? 2 : val > 0.42 ? 3 : val > 0.28 ? 4 : 5];
    g.fillRect(x, y, 1, 1);
  }
  return c;
}
// Clouds pinned to the sky: each sits at a fraction of the screen width, so they spread
// across any screen shape
function buildClouds() {
  const r = rng(7), n = 6, list = [];
  for (let i = 0; i < n; i++) {
    const tower = i === 1 || i === 4;
    const w = tower ? 90 + Math.floor(r() * 40) : 30 + Math.floor(r() * 60);
    const h = tower ? 60 + Math.floor(r() * 20) : clamp(Math.round(w * (0.3 + r() * 0.25)), 14, 40);
    const bottom = tower ? 85 + r() * 25 : 30 + r() * 70;
    list.push({ u: (i + 0.25 + r() * 0.5) / n, y: Math.max(2, Math.round(bottom - h)), img: makeCloud(r, w, h, tower) });
  }
  return list;
}

// ---------------------------------------------------------------------------
// Hills behind the houses, with Australian icons: Sydney Harbour with the Harbour
// Bridge and the Opera House, and Uluru out in the red centre
// ---------------------------------------------------------------------------
const HILL_GREENS = ['#7cc457', '#5aa846', '#43913d', '#317a36', '#24652f'];
const HILL_HAZE = '#a9bccb', FAR = 0.5;   // the green hills are low and greyed out, so they read as far away
function buildHills() {
  const P = LEVEL_W * PARALLAX.hills, p = painter(P, H, true), r = rng(31);
  const WATER = 138, OUTBACK = [400, 600], ULURU_X = 450;
  const ph = [1, 2, 3, 5, 8].map(() => r() * Math.PI * 2);
  const zone = (x, [a, b], soft) => clamp(Math.min(x - a, b - x) / soft, 0, 1);
  const top = x => {
    let y = 133 + [5, 3, 2, 1, 0.5].reduce((s, amp, i) => s + amp * Math.sin(2 * Math.PI * [1, 2, 3, 5, 8][i] * x / P + ph[i]), 0);
    y += (WATER + 2 - y) * zone(x, HARBOUR, 30);                        // dip down to the harbour
    y += (136 - y) * zone(x, OUTBACK, 40);                              // flat red plain
    return Math.round(y);
  };
  for (let x = 0; x < P; x++) {
    const t = top(x), slope = top(x + 1) - top(x - 1), red = zone(x, OUTBACK, 40), harbour = zone(x, HARBOUR, 30);
    for (let y = t; y < H; y++) {
      const d = y - t;
      let c;
      if (red > 0.5) c = d === 0 ? '#e0905a' : (x * 7 + y * 13) % 17 === 0 ? '#7d7a3a' : dither(x, y, d / 14) ? '#b9643a' : '#cc7646';
      else {
        let tone = slope < -1 ? 0 : slope > 1 ? 2 : 1;                    // slopes facing the light are paler
        if (d < 2) tone = 0;
        else if (d > 3) tone += hash(x, y) < 0.35 ? 2 : 1;                 // forest texture
        c = HILL_GREENS[Math.min(4, tone)];
      }
      const water = harbour > 0 && t >= WATER - 2 && y >= WATER;
      if (water) c = (y + Math.floor(x / 9)) % 6 === 0 ? '#9fd8f2' : y === WATER ? '#7cc4ea' : '#3d93d4';
      p.px(x, y, water || red > 0.5 ? mix(c, '#8fc3ea', 0.12) : mix(c, HILL_HAZE, FAR));
    }
  }

  // Bush on the hills: little dark trees, lit on the left
  for (let k = 0; k < 420; k++) {
    const x = Math.floor(r() * P);
    if (zone(x, OUTBACK, 30) > 0 || zone(x, HARBOUR, 20) > 0) continue;
    const y = top(x) + 1 + Math.floor(r() ** 2 * 10), th = 2 + Math.floor(r() * 2);
    for (let j = 0; j < th; j++) {
      const half = Math.min(j, th - 1 - j < 1 ? 0 : 2) >> 1;
      p.px(x - half, y - th + j, mix(HILL_GREENS[4], HILL_HAZE, FAR), half * 2 + 1, 1);
      p.px(x - half, y - th + j, mix(HILL_GREENS[2], HILL_HAZE, FAR));
    }
  }

  // Sydney Harbour Bridge: a steel arch between granite pylons, with the deck through it
  const bx0 = 110, bx1 = 220, mid = (bx0 + bx1) / 2, half = (bx1 - bx0) / 2 - 12, deck = 127;
  const arch = (x, apex, end) => apex + (end - apex) * ((x - mid) / half) ** 2;
  for (let x = bx0 + 12; x <= bx1 - 12; x++) {
    const yt = Math.round(arch(x, 99, 120)), yb = Math.round(arch(x, 104, 134));
    for (let y = yt; y <= Math.min(yb, WATER); y++) {
      const edge = y === yt || y === yb, lattice = (x + y) % 4 === 0 || (x - y) % 4 === 0;
      if (edge) p.px(x, y, '#4f565e');
      else if (lattice) p.px(x, y, '#7a838c');
    }
    if (yb < deck && x % 3 === 0) p.px(x, yb, '#6a727a', 1, deck - yb);  // hangers
  }
  p.px(bx0, deck, '#5a6168', bx1 - bx0, 2);
  p.px(bx0, deck + 2, '#3c4248', bx1 - bx0, 1);
  for (const px0 of [bx0 + 2, bx1 - 12]) {                               // granite pylons
    p.px(px0, 110, '#c9b99a', 10, WATER - 110);
    p.px(px0 + 7, 110, '#a8987a', 3, WATER - 110);
    p.px(px0 - 1, 109, '#ddd0b2', 12, 2);
    p.px(px0 + 3, 113, '#8f8064', 4, 5);
  }

  // Sydney Opera House: white sails on a sandstone podium
  // Each shell is a pointed sail: a steep curved front rising to its tip, a long curved back
  const ox = 236, ob = 136;
  p.px(ox - 4, ob, '#d8c8a8', 62, 3);
  p.px(ox - 4, ob + 3, '#b8a888', 62, 1);
  for (const [sx, w, h] of [[ox + 34, 13, 15], [ox + 43, 11, 11], [ox, 18, 24], [ox + 11, 16, 19], [ox + 22, 13, 14]]) {
    const peak = Math.round(w * 0.22);
    for (let i = 0; i < w; i++) {
      const t = i < peak ? Math.sqrt(i / peak) : 1 - ((i - peak) / (w - peak)) ** 1.7;
      const hh = Math.round(h * t);
      for (let j = 0; j < hh; j++) {
        let c = i <= peak ? '#ffffff' : i > w - 3 ? '#c9cdd0' : (j + 2 * i) % 6 === 0 ? '#dfe0da' : '#f1f0ea';
        if (j === hh - 1 && i > peak) c = '#d6d8d6';                     // edge of the shell
        if (j < 3 && i > 1 && i < w * 0.55) c = '#3c4650';               // glass under the shell
        p.px(sx + i, ob - 1 - j, c);
      }
    }
  }

  // Uluru: a red monolith with dark gullies down its face, scrub along its foot
  const uw = 96, uh = 27, ub = 137;
  for (let i = 0; i < uw; i++) {
    const t = i / (uw - 1);
    const hh = Math.round(uh * Math.sqrt(Math.max(0, 1 - Math.abs(2 * t - 1) ** 3.2)) + Math.sin(i * 0.7) * 0.6);
    for (let j = 0; j < hh; j++) {
      const y = ub - j, fromTop = hh - j;
      let c = t < 0.35 ? '#de7a3e' : t < 0.75 ? '#c75d2c' : '#a8471f';
      if (fromTop <= 1) c = t < 0.6 ? '#ee9a5c' : '#cf6a36';
      else if (i % 7 === 3 && fromTop < hh * 0.8) c = '#9a3f1c';          // gullies
      else if (dither(i, j, j / uh * 0.5)) c = mix(c, '#7a2e14', 0.35);   // darker towards the base
      p.px(ULURU_X + i, y, c);
    }
  }
  for (let k = 0; k < 40; k++) p.px(ULURU_X - 10 + r() * (uw + 20), ub + r() * 2, r() < 0.5 ? '#6f7a34' : '#58622a', 2, 1);
  return { P, c: p.c };
}

// ---------------------------------------------------------------------------
// Suburb: single-storey Australian brick houses with shallow roofs, fences,
// gum trees, jacarandas, bottlebrush, hedges, Hills Hoists and TV aerials
// ---------------------------------------------------------------------------
const GUM_LEAF = ['#93a95c', '#6c8a42', '#4e6a33'];
const JACARANDA = ['#b4d878', '#92c05a', '#70a244'];   // light green (they were purple)
const LEAFY = ['#7caa4c', '#5a8a38', '#3f6a2c'];
const BUSH = ['#6f9a45', '#4f7b35', '#3a5e29'];
const BRICKS = [
  ['#a8492f', '#943f28', '#c9a48a'],   // red
  ['#d8c39a', '#c6ae86', '#ece2cc'],   // cream
  ['#8c5636', '#784a2e', '#b99a7c'],   // 70s liver brick
  ['#cfa268', '#bb8f57', '#e6cfa8']    // blonde
];
const ROOFS = [
  { steel: false, c1: '#b4532f', c2: '#963f20', c3: '#c96a42', cap: '#7f3519', fascia: '#ece6d6' },  // terracotta tiles
  { steel: false, c1: '#7d7064', c2: '#685d53', c3: '#8e8276', cap: '#544b43', fascia: '#e2dccd' },  // concrete tiles
  { steel: true, c1: '#5d6263', c2: '#4b4f50', cap: '#3f4243', fascia: '#5d6263' },                  // Colorbond grey
  { steel: true, c1: '#e6dbb8', c2: '#d1c49e', cap: '#bfb18b', fascia: '#e6dbb8' },                  // Colorbond cream
  { steel: true, c1: '#7b302b', c2: '#682823', cap: '#561f1b', fascia: '#efe9dc' }                   // Colorbond red
];

function leafClump(p, r, cx, cy, rx, ry, pal, flatBase) {
  for (let dy = -Math.ceil(ry); dy <= Math.ceil(ry); dy++) {
    if (flatBase && dy > 0) break;
    for (let dx = -Math.ceil(rx); dx <= Math.ceil(rx); dx++) {
      const e = (dx / rx) ** 2 + (dy / ry) ** 2;
      if (e > 1 - r() * 0.3) continue;
      const t = dy / ry + dx / rx * 0.4 + (r() - 0.5) * 0.5;
      p.px(cx + dx, cy + dy, t < -0.45 ? pal[0] : t < 0.35 ? pal[1] : pal[2]);
    }
  }
}

function tree(p, r, x0, base, height, kind, scale = 1) {
  const clumps = [];
  const bark = kind === 'gum' ? ['#efe8d8', '#d9cfb9', '#b0a38a'] : ['#7a6250', '#5f4a3b', '#46362a'];
  const spread = kind === 'jacaranda' ? 0.95 : 0.7;
  function branch(x, y, ang, len, w, depth) {
    for (let i = 0; i < len; i++) {
      x += Math.cos(ang); y += Math.sin(ang); ang += (r() - 0.5) * 0.12;
      const ww = Math.max(1, Math.round(w * (1 - 0.4 * i / len)));
      for (let s = 0; s < ww; s++) {
        let c = bark[1];
        if (ww > 1 && s === 0) c = bark[0];
        else if (ww > 1 && s === ww - 1) c = bark[2];
        else if (kind === 'gum' && r() < 0.08) c = '#c99a5e';
        p.px(x - ww / 2 + s, y, c);
      }
    }
    if (depth < 3) {
      const n = 2 + (r() < 0.4 ? 1 : 0);
      for (let k = 0; k < n; k++)
        branch(x, y, ang + (k - (n - 1) / 2) * spread + (r() - 0.5) * 0.3, len * (0.55 + r() * 0.2), w * 0.6, depth + 1);
    }
    if (depth >= 2) clumps.push([x, y]);
  }
  branch(x0, base, -Math.PI / 2 + (r() - 0.5) * 0.25, height * 0.4, (kind === 'gum' ? 4 : 3) * scale, 0);
  const pal = kind === 'gum' ? GUM_LEAF : kind === 'jacaranda' ? JACARANDA : LEAFY;
  const size = (kind === 'gum' ? 1 : 1.35) * scale;
  for (const [cx, cy] of clumps) leafClump(p, r, cx, cy, (5 + r() * 4) * size, (3 + r() * 2) * size, pal);
}

function bush(p, r, x, base, kind) {
  if (kind === 'hedge') {
    const w = 10 + Math.floor(r() * 10), h = 5 + Math.floor(r() * 3);
    for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) {
      if ((y === 0 && (i === 0 || i === w - 1))) continue;
      p.px(x + i, base - h + y, y === 0 ? BUSH[0] : (r() < 0.25 ? BUSH[2] : BUSH[1]));
    }
    return;
  }
  const rx = 3 + r() * 3, ry = 3 + r() * 2.5;
  leafClump(p, r, x, base, rx, ry * 1.4, BUSH, true);
  if (kind === 'bottlebrush') {
    for (let k = 0; k < rx * 2; k++) {
      const bx = x + (r() - 0.5) * rx * 1.6, by = base - 2 - r() * ry * 1.1;
      p.px(bx, by, '#d42f2f'); p.px(bx, by + 1, '#a61f22');
    }
  } else if (kind === 'agapanthus') {
    for (let k = 0; k < 4; k++) p.px(x + (k - 1.5) * 2.5, base - ry * 1.4 - 2, '#7d8fe0', 2, 2);
  }
}

function fence(p, r, x, w) {
  const cols = pick(r, [['#5d6466', '#4c5254', '#737a7c'], ['#6f8a6c', '#5c7559', '#86a083'], ['#8a8578', '#77736a', '#a19c8f']]);
  const top = SUBURB_BASE - 11;
  for (let i = 0; i < w; i++) for (let y = top; y < SUBURB_BASE; y++)
    p.px(x + i, y, y === top ? cols[2] : i % 3 === 0 ? cols[1] : cols[0]);
}

function hillsHoist(p, x) {
  const top = SUBURB_BASE - 30;
  p.px(x, top, '#9da3a8', 1, 30);
  for (let i = 1; i <= 16; i++) { const dy = Math.round(i / 4); p.px(x - i, top + dy, '#b9bec2'); p.px(x + i, top + dy, '#b9bec2'); }
  p.px(x - 12, top + 4, '#d64534', 5, 5);    // shirt
  p.px(x - 5, top + 3, '#f2efe6', 4, 8);     // sheet
  p.px(x + 4, top + 3, '#3f6fc4', 4, 7);     // towel
  p.px(x + 10, top + 4, '#f1c640', 3, 4);    // tea towel
}

function house(p, r, x, w) {
  const B = SUBURB_BASE, wallH = 15 + Math.floor(r() * 4), top = B - wallH;
  const [bc, bc2, mortar] = pick(r, BRICKS);
  for (let y = top; y < B; y++) for (let i = 0; i < w; i++) {
    const row = y - top, course = Math.floor(row / 3);
    const isMortar = row % 3 === 2 || (i + (course % 2) * 2) % 5 === 4;
    p.px(x + i, y, isMortar ? mortar : ((i * 7 + course * 13) % 11 < 3 ? bc2 : bc));
  }
  p.px(x, top, 'rgba(0,0,0,0.28)', w, 1);       // shadow under the eaves

  // Garage roller door at one end
  const garageLeft = r() < 0.5, gw = 16, gx = garageLeft ? x + 3 : x + w - 3 - gw;
  for (let y = B - 11; y < B; y++) p.px(gx, y, y === B - 11 ? '#8f897d' : y % 2 ? '#d8d2c4' : '#c4bdae', gw, 1);

  // Front door, then aluminium windows along the rest of the wall
  const sx = garageLeft ? gx + gw + 4 : x + 4, ex = garageLeft ? x + w - 4 : gx - 4;
  const dx = garageLeft ? sx : ex - 6;
  p.px(dx, B - 12, '#bdb6a8', 7, 12);
  p.px(dx + 1, B - 11, pick(r, ['#7a4b2c', '#2f4a3a', '#efebe1', '#8a2f2a']), 5, 11);
  p.px(dx + 4, B - 6, '#e6c35a');
  const frame = r() < 0.5 ? '#e8e8e4' : '#b9bec2';
  let wx = garageLeft ? dx + 11 : sx, wEnd = garageLeft ? ex : dx - 5;
  while (wx + 10 <= wEnd) {
    const ww = Math.min(14, wEnd - wx), wy = top + 4;
    p.px(wx, wy, frame, ww, 7);
    for (let j = 0; j < 5; j++) p.px(wx + 1, wy + 1 + j, ['#c3dbe8', '#a9c7d9', '#8fb1c6', '#7aa0b8', '#6f94ad'][j], ww - 2, 1);
    p.px(wx + Math.floor(ww / 2), wy + 1, frame, 1, 5);
    p.px(wx + 2, wy + 3, '#e8f4fa'); p.px(wx + 3, wy + 2, '#e8f4fa');
    p.px(wx - 1, wy + 7, '#cfc8b8', ww + 2, 1);
    wx += ww + 6;
  }

  // Shallow hip roof: a low trapezoid with wide eaves
  const roof = pick(r, ROOFS), rh = 5 + Math.floor(r() * 3), run = 2.6;
  for (let j = 0; j < rh; j++) {
    const y = top - 1 - j, xl = x - 3 + Math.round(j * run), xr = x + w + 2 - Math.round(j * run);
    for (let xx = xl; xx <= xr; xx++) {
      let c;
      if (j === 0) c = roof.fascia;
      else if (j === rh - 1 || xx === xl || xx === xr) c = roof.cap;
      else if (roof.steel) c = xx & 1 ? roof.c1 : roof.c2;
      else c = j % 2 === 0 ? roof.c2 : ((xx + j) % 4 === 0 ? roof.c3 : roof.c1);
      p.px(xx, y, c);
    }
  }
  const ridge = top - rh;
  if (r() < 0.45) {                                   // solar panels
    const n = 3 + Math.floor(r() * 4), px0 = x + 9 + Math.floor(r() * Math.max(1, w - 18 - n * 5));
    for (let k = 0; k < n; k++) { p.px(px0 + k * 5, top - 4, '#27365c', 4, 3); p.px(px0 + k * 5, top - 4, '#3d5288', 4, 1); }
  }
  if (r() < 0.5) {                                    // TV aerial
    const ax = x + Math.round(w * (0.25 + r() * 0.5));
    p.px(ax, ridge - 10, '#9aa0a5', 1, 10);
    p.px(ax - 5, ridge - 10, '#9aa0a5', 11, 1);
    for (let k = 0; k < 6; k++) { const len = 5 - Math.floor(k * 0.6); p.px(ax - 5 + k * 2, ridge - 10 - Math.floor(len / 2), '#b3b9bd', 1, len); }
  }
  if (r() < 0.2) {                                    // brick chimney
    const cx = x + Math.round(w * (0.2 + r() * 0.6));
    p.px(cx, ridge - 4, bc, 4, 5); p.px(cx - 1, ridge - 5, mortar, 6, 1);
  }
}

function letterbox(p, r, x) {
  const B = SUBURB_BASE;
  if (r() < 0.5) {                                    // brick pillar
    p.px(x, B - 8, '#a8492f', 5, 8); p.px(x - 1, B - 9, '#c9a48a', 7, 1); p.px(x + 1, B - 6, '#2a2a2a', 3, 1);
  } else {                                            // post and box
    p.px(x + 2, B - 7, '#6b5038', 1, 7); p.px(x, B - 11, '#c0392b', 5, 4); p.px(x, B - 11, '#e05a48', 5, 1);
  }
}

function buildSuburb() {
  const P = LEVEL_W * PARALLAX.suburb, p = painter(P, H, true), r = rng(2024);
  const lots = 8, lotW = P / lots;
  for (let i = 0; i < lots; i++) {
    const lx = i * lotW;
    if (i === 5) {                                    // a little park
      tree(p, r, lx + 25, SUBURB_BASE, 80, 'gum');
      tree(p, r, lx + 70, SUBURB_BASE, 66, 'gum');
      tree(p, r, lx + 100, SUBURB_BASE, 52, 'leafy');
      p.px(lx + 45, SUBURB_BASE - 6, '#8a5a32', 14, 2); p.px(lx + 47, SUBURB_BASE - 4, '#6b4426', 1, 4); p.px(lx + 56, SUBURB_BASE - 4, '#6b4426', 1, 4);
      bush(p, r, lx + 85, SUBURB_BASE, 'bottlebrush');
      continue;
    }
    if (r() < 0.75) tree(p, r, lx + 10 + r() * (lotW - 20), SUBURB_BASE - 2, 50 + r() * 28, pick(r, ['gum', 'gum', 'jacaranda', 'leafy']));
    const w = 60 + Math.floor(r() * 16), hx = lx + 10 + Math.floor(r() * (lotW - w - 20));
    if (r() < 0.45) hillsHoist(p, hx - lx > lotW / 2 - w / 2 ? hx - 14 : hx + w + 14);
    fence(p, r, lx, lotW);
    house(p, r, hx, w);
    letterbox(p, r, lx + 3);
    for (let k = 0; k < 2 + Math.floor(r() * 3); k++)
      bush(p, r, hx + 6 + r() * (w - 12), SUBURB_BASE, pick(r, ['bush', 'bottlebrush', 'hedge', 'agapanthus']));
  }
  return { P, c: p.c };
}

// The back streets: smaller, simpler houses (flat brick, no fine detail) in rows that
// tier off into the distance, with fences, trees and a haze over everything
function farHouse(p, r, x, s, base) {
  const S = n => Math.max(1, Math.round(n * s));
  const w = Math.round((56 + r() * 18) * s), wallH = S(15 + r() * 3), top = base - wallH;
  const [bc, bc2, mortar] = pick(r, BRICKS);
  for (let y = top; y < base; y++) p.px(x, y, s > 0.6 && (y - top) % 3 === 2 ? mortar : bc, w, 1);
  p.px(x, top, bc2, w, 1);                                           // shadow under the eaves
  const garageLeft = r() < 0.5, gw = S(16), gx = garageLeft ? x + S(3) : x + w - S(3) - gw;
  p.px(gx, base - S(11), '#cfc9bb', gw, S(11));
  const ww = S(12), wh = S(6), wy = top + S(4);
  let wx = garageLeft ? gx + gw + S(4) : x + S(4);
  const wEnd = garageLeft ? x + w - S(3) : gx - S(3);
  while (wx + ww <= wEnd) {
    p.px(wx, wy, '#dfe3e5', ww, wh);
    if (ww > 2 && wh > 2) p.px(wx + 1, wy + 1, '#7f9fb5', ww - 2, wh - 2);
    wx += ww + S(6);
  }
  const dx = garageLeft ? gx + gw + S(2) : gx - S(8);
  p.px(dx, base - S(11), pick(r, ['#5a3a24', '#2f4a3a', '#7a2c26']), S(5), S(11));
  const roof = pick(r, ROOFS), rh = S(5 + r() * 2), eave = S(3);
  for (let j = 0; j < rh; j++) {
    const y = top - 1 - j, xl = x - eave + Math.round(j * 2.6), xr = x + w - 1 + eave - Math.round(j * 2.6);
    for (let xx = xl; xx <= xr; xx++)
      p.px(xx, y, j === 0 ? roof.fascia : j === rh - 1 ? roof.cap : roof.steel ? (xx & 1 ? roof.c1 : roof.c2) : (j % 2 ? roof.c1 : roof.c2));
  }
  if (r() < 0.4) {                                                   // TV aerial
    const ax = x + Math.round(w * (0.3 + r() * 0.4)), ah = S(8);
    p.px(ax, top - rh - ah, '#9aa0a5', 1, ah);
    p.px(ax - S(3), top - rh - ah, '#9aa0a5', S(7), 1);
  }
  return w;
}

function buildBackStreet({ f, base, scale, haze, seed }) {
  const P = LEVEL_W * f, canvasP = painter(P, H, true), r = rng(seed);
  const p = { px: (x, y, col, w, h) => canvasP.px(x, y, col[0] === '#' ? mix(col, HILL_HAZE, haze) : col, w, h) };
  // Leave a gap wherever this row could be in front of the harbour. The row scrolls faster
  // than the hills, so the gap covers every screen position (-40 to 520) the harbour passes.
  const ratio = f / PARALLAX.hills;
  const gapEnd = HARBOUR[1] * ratio + (1 - ratio) * -40, gapStart = HARBOUR[0] * ratio + (1 - ratio) * 520;
  const from = Math.ceil(gapEnd), to = Math.floor(gapStart + P);      // the street runs from the end of the gap round to its start
  for (let x = from; x < to; x++) for (let y = base; y < H; y++)       // back yards, hiding the rows behind
    p.px(x, y, dither(x, y, 0.5) ? '#78a648' : '#6c9a40');
  const fh = Math.max(2, Math.round(10 * scale));                     // a long run of back fences
  for (let x = from; x < to; x++) p.px(x, base - fh, scale > 0.6 && x % 3 === 0 ? '#5c6264' : '#6c7476', 1, fh);
  for (let k = 0, n = Math.round((to - from) / 110); k < n; k++)
    tree(p, r, from + 12 + r() * (to - from - 24), base - 1, (32 + r() * 22) * scale, pick(r, ['gum', 'gum', 'leafy', 'jacaranda']), scale);
  let x = from + r() * 10;
  while (x < to - 80 * scale) {
    const w = farHouse(p, r, Math.round(x), scale, base);
    for (let k = 0; k < 2; k++) if (r() < 0.6) leafClump(p, r, x + r() * w, base, (2 + r() * 3) * scale + 1, (2 + r() * 2) * scale + 1, BUSH, true);
    x += w + (6 + r() * 18) * scale;
  }
  return { P, c: canvasP.c, f };
}

// ---------------------------------------------------------------------------
// Ground: mown lawn with stripes, clover and dandelions, a lap flag and a warning sign
// ---------------------------------------------------------------------------
function buildGround() {
  const P = LEVEL_W, p = painter(P, H, true), r = rng(99);
  const light = ['#7db446', '#77ad42'], dark = ['#6a9c3a', '#64953a'];
  for (let x = 0; x < P; x++) {
    const stripe = Math.sin(x / 48 * Math.PI);        // mower stripes
    const tuft = r() < 0.35 ? 1 + Math.floor(r() * 2) : 0;
    for (let y = GRASS_TOP - tuft; y < H; y++) {
      const depth = (y - GRASS_TOP) / (H - GRASS_TOP);
      const isLight = dither(x, y, (stripe + 1) / 2);
      let c = isLight ? light[depth > 0.6 ? 1 : 0] : dark[depth > 0.6 ? 1 : 0];
      if (y < GRASS_TOP) c = '#8bc252';
      else if (y === GRASS_TOP) c = '#93c95a';
      else if (r() < 0.06) c = '#5a8a32';
      p.px(x, y, c);
    }
  }
  for (let k = 0; k < 160; k++) {                     // clover and dandelions
    const x = r() * P, y = GRASS_TOP + 3 + r() * (H - GRASS_TOP - 4);
    p.px(x, y, r() < 0.7 ? '#f4f4ee' : '#f2d43a');
  }
  // Lap flag (the start of each loop)
  p.px(20, 132, '#d8d8d8', 1, 44);
  for (let j = 0; j < 6; j++) for (let i = 0; i < 10; i++) p.px(21 + i, 132 + j, (Math.floor(i / 2) + Math.floor(j / 2)) % 2 ? '#1c1c1c' : '#f6f6f6');
  // Warning sign
  const sx = 70, sy = 128;
  p.px(sx + 6, sy + 16, '#8a8f94', 2, 30); p.px(sx + 27, sy + 16, '#8a8f94', 2, 30);
  p.px(sx, sy, '#1c1c1c', 35, 17); p.px(sx + 1, sy + 1, '#f2c230', 33, 15);
  glyphs('SWOOPING', sx + 2, sy + 2, 1, (x, y) => p.px(x, y, '#1c1c1c'));
  glyphs('MAGPIES', sx + 4, sy + 9, 1, (x, y) => p.px(x, y, '#1c1c1c'));
  shopInterior(p, r);
  shopSign(p);
  return { P, c: p.c };
}

// ---------------------------------------------------------------------------
// The magpie, drawn smoothly (not pixel art): glossy black, white nape, shoulders
// and tail base, a pale bill with a dark tip and a red-brown eye.
// Units: about 100 from tail to bill; origin at the body centre, facing right, +y down.
// ---------------------------------------------------------------------------
function blackFill(g, x, y, r) {
  const gr = g.createRadialGradient(x - r * 0.4, y - r * 0.5, r * 0.05, x, y, r * 1.2);
  gr.addColorStop(0, '#4b5060'); gr.addColorStop(0.35, '#22232b'); gr.addColorStop(1, '#0c0c10');
  return gr;
}
function whiteFill(g, x, y, r) {
  const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.05, x, y, r * 1.1);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.6, '#eceef1'); gr.addColorStop(1, '#b8bcc6');
  return gr;
}
function blob(g, fill, draw) { g.beginPath(); draw(); g.closePath(); g.fillStyle = fill; g.fill(); }

// A spread wing at the shoulder; open runs from 1 (raised) through 0 (edge on) to -1 (lowered)
function spreadWing(g, open, far) {
  g.save();
  g.translate(far ? 9 : 5, far ? -9 : -6);
  g.rotate(-0.15);
  g.scale(far ? 0.9 : 1, Math.abs(open) < 0.12 ? Math.sign(open || 1) * 0.12 : open);
  blob(g, far ? '#101014' : blackFill(g, 0, -25, 30), () => {
    g.moveTo(9, 0); g.bezierCurveTo(12, -18, 9, -38, 0, -50);
    for (const [x, y] of [[-6, -49], [-4, -44], [-11, -45], [-9, -40], [-16, -40], [-14, -35], [-21, -34]]) g.lineTo(x, y);
    g.bezierCurveTo(-20, -22, -16, -8, -13, 0);
  });
  blob(g, far ? '#9da1aa' : whiteFill(g, 3, -10, 14), () => {           // white shoulder
    g.moveTo(9, 0); g.bezierCurveTo(11, -9, 10, -17, 7, -22);
    g.quadraticCurveTo(-2, -20, -6, -12); g.quadraticCurveTo(-6, -4, -6, 0);
  });
  g.strokeStyle = 'rgba(80,90,115,0.5)'; g.lineWidth = 0.8;               // feather lines
  for (const [x, y] of [[-5, -46], [-12, -42], [-18, -37]]) { g.beginPath(); g.moveTo(-6, -22); g.lineTo(x, y); g.stroke(); }
  g.restore();
}

function foldedWing(g) {
  blob(g, blackFill(g, -8, -6, 26), () => {
    g.moveTo(14, -6); g.bezierCurveTo(6, -14, -14, -13, -24, -7);
    g.lineTo(-41, -1); g.quadraticCurveTo(-24, 6, -8, 6); g.quadraticCurveTo(8, 5, 14, -6);
  });
  blob(g, whiteFill(g, 2, -8, 12), () => {                                // white shoulder
    g.moveTo(13, -5); g.bezierCurveTo(8, -12, -4, -12, -10, -9);
    g.quadraticCurveTo(-8, -3, 0, -1); g.quadraticCurveTo(8, 0, 13, -5);
  });
  g.strokeStyle = 'rgba(90,100,125,0.55)'; g.lineWidth = 0.8;
  for (const [y0, y1] of [[-4, -1], [0, 1.5], [3, 3.5]]) { g.beginPath(); g.moveTo(-12, y0); g.lineTo(-38, y1); g.stroke(); }
}

function head(g, drunk) {
  blob(g, '#141418', () => g.ellipse(-7, 5, 11, 9, -0.5, 0, Math.PI * 2));          // neck
  blob(g, blackFill(g, 0, 0, 11), () => g.arc(0, 0, 11, 0, Math.PI * 2));
  blob(g, whiteFill(g, -9, 2, 9), () => {                                            // white nape
    g.moveTo(-5, -9.5); g.quadraticCurveTo(-13, -6, -13, 5); g.lineTo(-7, 9); g.quadraticCurveTo(-9, -1, -3, -8);
  });
  const bill = () => { g.moveTo(7, -4.6); g.quadraticCurveTo(17, -5.2, 26, 0.6); g.quadraticCurveTo(17, 3.3, 7, 4.6); };
  const bg = g.createLinearGradient(0, -5, 0, 5);
  bg.addColorStop(0, '#eef0f4'); bg.addColorStop(0.5, '#c9cdd6'); bg.addColorStop(1, '#9196a2');
  blob(g, bg, bill);
  g.save(); g.beginPath(); bill(); g.clip(); g.fillStyle = '#25262c'; g.fillRect(20, -8, 10, 16); g.restore();   // dark tip
  g.beginPath(); g.moveTo(8, 0.8); g.quadraticCurveTo(16, 1.1, 24.5, 0.7);
  g.strokeStyle = '#555a66'; g.lineWidth = 0.6; g.stroke();
  blob(g, '#a3301c', () => g.arc(3, -3, 2.4, 0, Math.PI * 2));                      // eye
  blob(g, '#130808', () => g.arc(3.3, -3, 1.2, 0, Math.PI * 2));
  blob(g, '#ffffff', () => g.arc(2.6, -3.8, 0.6, 0, Math.PI * 2));
  if (drunk) {                                                                        // bright red eye with a flare
    const pulse = 1 + 0.25 * Math.sin(time * 9);
    blob(g, '#ff2414', () => g.arc(3, -3, 2.6, 0, Math.PI * 2));
    blob(g, '#ffd0c0', () => g.arc(2.5, -3.6, 0.7, 0, Math.PI * 2));
    g.save(); g.globalCompositeOperation = 'lighter';
    const glow = g.createRadialGradient(3, -3, 0, 3, -3, 9 * pulse);
    glow.addColorStop(0, 'rgba(255,80,50,0.9)'); glow.addColorStop(1, 'rgba(255,30,10,0)');
    blob(g, glow, () => g.arc(3, -3, 9 * pulse, 0, Math.PI * 2));
    for (const [rx, ry] of [[15 * pulse, 0.7], [0.7, 10 * pulse]]) {
      const st = g.createRadialGradient(3, -3, 0, 3, -3, Math.max(rx, ry));
      st.addColorStop(0, 'rgba(255,200,180,0.9)'); st.addColorStop(1, 'rgba(255,60,30,0)');
      blob(g, st, () => g.ellipse(3, -3, rx, ry, 0.3, 0, Math.PI * 2));
    }
    g.restore();
  }
  g.beginPath(); g.arc(0, 0, 9.5, Math.PI * 1.05, Math.PI * 1.55);                  // sheen
  g.strokeStyle = 'rgba(130,150,200,0.35)'; g.lineWidth = 1.6; g.stroke();
}

// While swooping, his legs dangle back and down from his belly at about 15 degrees,
// fluttering a little in the wind. Drawn in the body frame, under the body.
function danglingLegs(g) {
  g.save();
  g.strokeStyle = '#3a3b40'; g.lineCap = g.lineJoin = 'round';
  [[-3, 0], [4, 1.9]].forEach(([hip, phase]) => {
    const a = Math.PI - Math.PI / 12 + Math.sin(time * 26 + phase) * 0.07;   // 15 degrees below straight back, fluttering
    const knee = [hip + Math.cos(a) * 14, 11 + Math.sin(a) * 14];
    const a2 = a + Math.sin(time * 31 + phase) * 0.12;
    const foot = [knee[0] + Math.cos(a2) * 13, knee[1] + Math.sin(a2) * 13];
    for (const [w, col] of [[4.2, '#202126'], [2.4, '#55575e']]) {       // dark leg with a lighter shine
      g.strokeStyle = col; g.lineWidth = w;
      g.beginPath(); g.moveTo(hip, 9); g.lineTo(...knee); g.lineTo(...foot); g.stroke();
    }
    g.strokeStyle = '#2a2b30'; g.lineWidth = 2; g.beginPath();             // toes, curled and flicking
    for (const t of [-0.6, 0, 0.6]) {
      const ta = a2 + t + Math.sin(time * 40 + phase + t) * 0.1;
      g.moveTo(...foot); g.lineTo(foot[0] + Math.cos(ta) * 6, foot[1] + Math.sin(ta) * 6);
    }
    g.stroke();
  });
  g.restore();
}

// Afterburner flames out of the tail while swooping; power 0 to 1
function afterburner(g, power) {
  if (power < 0.02) return;
  g.save();
  g.translate(-44, 1);
  g.globalCompositeOperation = 'lighter';
  const glow = g.createRadialGradient(0, 0, 0, 0, 0, 30 * power);
  glow.addColorStop(0, 'rgba(255,170,60,0.6)'); glow.addColorStop(1, 'rgba(255,110,30,0)');
  g.fillStyle = glow; g.beginPath(); g.arc(0, 0, 30 * power, 0, Math.PI * 2); g.fill();
  [[110, 13, 'rgba(255,60,20,0.6)'], [82, 9, 'rgba(255,140,30,0.85)'], [54, 6, 'rgba(255,220,120,0.95)'], [28, 3, 'rgba(255,255,240,1)']].forEach(([len, w, col], i) => {
    const flicker = 1 + 0.15 * Math.sin(time * 41 + i * 1.7) + 0.1 * Math.sin(time * 67 + i * 2.9);
    const L = len * power * flicker, hw = w * (0.7 + 0.3 * power);
    const gr = g.createLinearGradient(0, 0, -L, 0);
    gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(255,80,20,0)');
    g.beginPath(); g.moveTo(3, -hw); g.quadraticCurveTo(-L * 0.45, -hw * 1.15, -L, 0); g.quadraticCurveTo(-L * 0.45, hw * 1.15, 3, hw); g.closePath();
    g.fillStyle = gr; g.fill();
  });
  g.restore();
}

// pose: { pitch (radians, + is nose down), headPitch, wings: 'folded' | open amount, legs: walk phase or null,
//         burn: afterburner 0 to 1, dangle: legs trailing in a swoop }
function drawMagpie(g, pose) {
  if (pose.legs !== null) {                                                // legs, in the upright frame
    const swing = Math.sin(pose.legs) * 5;
    g.strokeStyle = '#3a3b40'; g.lineCap = 'round';
    for (const [hip, foot, lift] of [[-3, -4 + swing, Math.max(0, Math.sin(pose.legs)) * 3], [5, 6 - swing, Math.max(0, -Math.sin(pose.legs)) * 3]]) {
      const fy = 30 - lift;
      g.lineWidth = 2.8; g.beginPath(); g.moveTo(hip, 10); g.lineTo(foot, fy); g.stroke();
      g.lineWidth = 1.6; g.beginPath();
      g.moveTo(foot, fy); g.lineTo(foot + 6, fy);
      g.moveTo(foot, fy); g.lineTo(foot + 4.5, fy - 1.2);
      g.moveTo(foot, fy); g.lineTo(foot - 3, fy); g.stroke();
    }
    blob(g, '#141418', () => g.ellipse(1, 12, 8, 6, 0, 0, Math.PI * 2));           // feathered thighs
  }
  g.save();
  g.rotate(pose.pitch);
  afterburner(g, pose.burn || 0);
  g.scale(1, Math.cos(pose.roll || 0));
  const spread = pose.wings !== 'folded';
  if (pose.dangle) danglingLegs(g);
  if (spread) spreadWing(g, pose.wings, true);
  const tailW = spread ? 1.35 : 1;                                         // tail: white base, black tip
  const tail = () => { g.moveTo(-16, -4 * tailW); g.lineTo(-41, -3 * tailW); g.quadraticCurveTo(-47, 1, -41, 6 * tailW); g.lineTo(-16, 6); };
  blob(g, whiteFill(g, -26, 0, 16), tail);
  g.save(); g.beginPath(); tail(); g.clip(); g.fillStyle = '#121216'; g.fillRect(-50, -12, 14, 24); g.restore();
  blob(g, blackFill(g, 0, 0, 24), () => g.ellipse(0, 0, 24, 15, 0, 0, Math.PI * 2));   // body
  blob(g, whiteFill(g, -15, 7, 8), () => g.ellipse(-15, 7, 8, 4.5, 0.2, 0, Math.PI * 2));  // under the tail
  blob(g, whiteFill(g, 6, -12, 14), () => {                                // white back of the neck
    g.moveTo(22, -12); g.quadraticCurveTo(10, -17, -6, -14); g.quadraticCurveTo(-12, -11, -8, -7);
    g.quadraticCurveTo(6, -9, 18, -3);
  });
  if (spread) spreadWing(g, pose.wings, false); else foldedWing(g);
  g.save(); g.translate(24, -9); g.rotate(pose.headPitch); head(g, pose.drunk); g.restore();
  g.restore();
}

// ---------------------------------------------------------------------------
// The bottle shop on the lawn: a BOTTLE-O in Dan Murphy's green. The face and name are on a
// sign on posts above the roof (scenery only: the magpie flies past it).
// The interior (shelves of bottles) is part of the ground layer, behind the magpie; the
// front (sign, glass, posters) is drawn on top of him, so we see him fly through the glass.
// ---------------------------------------------------------------------------
const SHOP = { x: 1000, w: 75, roof: 112, ceil: 120, floor: 160 };
const DM_GREEN = '#1f5b2c', DM_DARK = '#164622', DM_LINE = '#2a6d38', LIME = '#d4e62a';
const shopSpan = x => mod(x - SHOP.x, LEVEL_W) < SHOP.w;
const SHELVES = [131, 139, 147, 155], FRIDGE_SHELVES = [136, 145, 154];

// Inside: back wall, lights, shelves of bottles, a glowing fridge, a tiled floor. Drawn into the ground layer.
function shopInterior(p, r) {
  const { x, w, ceil, floor } = SHOP;
  p.px(x - 6, floor, '#c9c4b8', w + 12, 6);                          // footpath in front
  p.px(x - 6, floor + 6, '#a9a499', w + 12, 1);
  p.px(x, ceil, '#d9d6cf', w, floor - ceil);                         // back wall
  for (let i = 4; i < w - 4; i += 9) p.px(x + i, ceil + 1, '#fffbe8', 5, 1);   // ceiling lights
  for (const sy of SHELVES) p.px(x + 3, sy, '#8a8a8a', w - 34, 1);  // shelves (the stock goes on in buildShelfStock)
  p.px(x + w - 28, ceil + 5, '#9fb2bd', 25, floor - ceil - 5);       // fridge
  p.px(x + w - 27, ceil + 6, '#e9f6ff', 23, floor - ceil - 7);
  for (const sy of FRIDGE_SHELVES) p.px(x + w - 27, sy, '#b8c8d2', 23, 1);
  for (let i = 0; i < w; i += 6) p.px(x + i, floor - 1, '#b9b3a6', 5, 1);   // floor tiles
}

// The Dan Murphy's style face: a grinning man with slicked-back hair, white on green, woodcut
// style. Drawn smoothly at 4x, then turned into white pixels.
const FACE_W = 22, FACE_H = 29;
function signFace(p, ox, oy) {
  const S = 4, c = makeCanvas(FACE_W * S, FACE_H * S), g = c.getContext('2d');
  g.scale(S * FACE_W / 26, S * FACE_H / 32); g.lineCap = g.lineJoin = 'round';   // drawn in a 26 x 32 box
  const white = '#fff', green = '#000';
  const line = (w, pts) => { g.lineWidth = w; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); };
  g.fillStyle = white;
  g.beginPath(); g.ellipse(13, 17, 9.5, 12.5, 0, 0, Math.PI * 2); g.fill();                 // head
  g.beginPath(); g.ellipse(22.6, 17.5, 2.2, 3.6, 0.1, 0, Math.PI * 2); g.fill();            // ear
  g.beginPath(); g.moveTo(8, 27); g.lineTo(18, 27); g.lineTo(19, 32); g.lineTo(7, 32); g.fill();   // neck
  g.beginPath(); g.moveTo(1, 32); g.lineTo(9, 28); g.lineTo(12, 32); g.fill();               // collar
  g.beginPath(); g.moveTo(25, 32); g.lineTo(17, 28); g.lineTo(14, 32); g.fill();
  g.strokeStyle = green;
  for (let k = 0; k < 3; k++) line(0.8, [[6 + k, 7.6 - k * 1.6], [12 + k * 2, 4.4 + k * 0.7], [20.5, 7 + k * 1.3]]);   // hair swept back
  line(1.3, [[4.5, 10.5], [12, 8.6], [21.5, 10]]);                                            // hairline
  line(1.4, [[5.8, 12.6], [10.6, 11.6]]); line(1.4, [[14.8, 11.6], [19.5, 12.8]]);            // brows
  g.fillStyle = green;
  for (const ex of [8.4, 16.9]) { g.beginPath(); g.ellipse(ex, 14.6, 1.7, 1.05, 0, 0, Math.PI * 2); g.fill(); }   // eyes
  line(1.1, [[13.6, 13.5], [14.8, 19.2], [13.2, 20.4], [11, 20]]);                           // nose
  line(1.1, [[9, 19.5], [7, 24]]); line(1.1, [[17.4, 19.5], [19.4, 24]]);                    // laugh lines
  g.fillStyle = green;
  g.beginPath(); g.moveTo(7, 22); g.quadraticCurveTo(13, 23.6, 19.2, 22); g.quadraticCurveTo(13.2, 30, 7, 22); g.fill();   // big grin
  g.fillStyle = white;
  g.beginPath(); g.moveTo(8.8, 23.2); g.quadraticCurveTo(13, 24.4, 17.6, 23.2); g.lineTo(16.8, 24.9); g.quadraticCurveTo(13, 25.9, 9.6, 24.9); g.fill();   // teeth
  line(1, [[11, 29], [15, 29]]);                                                              // chin
  line(0.9, [[22.2, 16], [21.8, 18.6]]);                                                      // inside the ear
  line(1, [[9, 28.4], [13, 31.5], [17, 28.4]]);                                               // shirt opening
  const d = g.getImageData(0, 0, c.width, c.height).data;
  for (let y = 0; y < FACE_H; y++) for (let x = 0; x < FACE_W; x++) {
    let lit = 0;
    for (let j = 1; j < S; j += 2) for (let i = 1; i < S; i += 2) {
      const o = ((y * S + j) * c.width + x * S + i) * 4;
      if (d[o + 3] > 128 && d[o] > 128) lit++;
    }
    if (lit >= 2) p.px(ox + x, oy + y, '#f4f6f1');
  }
}

// The front: drawn over the magpie
// The sign on posts above the roof: the face and BOTTLE-O. Part of the ground layer, behind the magpie.
function shopSign(p) {
  const bw = 94, bh = 33, bx = SHOP.x + Math.round(SHOP.w / 2 - bw / 2), by = SHOP.roof - 10 - bh;
  for (const dx of [-14, 12]) { p.px(SHOP.x + SHOP.w / 2 + dx, by + bh, '#8a8f94', 2, 10); p.px(SHOP.x + SHOP.w / 2 + dx + 1, by + bh, '#6d7276', 1, 10); }
  p.px(bx - 1, by - 1, DM_DARK, bw + 2, bh + 2);
  p.px(bx, by, DM_GREEN, bw, bh);
  for (let i = 3; i < bw; i += 6) p.px(bx + i, by, DM_LINE, 1, bh);
  p.px(bx, by, '#2f7a42', bw, 1);
  signFace(p, bx + 3, by + 3);
  glyphs('BOTTLE-O', bx + 28, by + 12, 2, (x, y, s) => p.px(x, y, '#f4f6f1', s, s));
}

function buildShopFront() {
  const { w, roof, ceil, floor } = SHOP, top = roof, p = painter(w, floor + 4 - top, false);
  const Y = y => y - top;                                             // canvas rows start at the roof
  p.px(0, Y(roof), DM_GREEN, w, ceil - roof);                         // green fascia, panelled
  for (let i = 0; i < w; i += 6) p.px(i, Y(roof), DM_LINE, 1, ceil - roof);
  p.px(0, Y(roof), '#2f7a42', w, 1);
  p.px(0, Y(ceil) - 1, DM_DARK, w, 1);
  // Glass: a faint tint with a few highlight pixels; white frames
  p.px(0, Y(ceil), 'rgba(80,165,235,0.45)', w, floor - ceil);        // blue glass
  const gr = rng(4);
  for (let n = 0; n < 10; n++) {                                      // little highlight streaks on the glass
    const gx = 4 + gr() * (w - 14), gy = 7 + gr() * (floor - ceil - 18), len = 2 + Math.floor(gr() * 4);
    for (let k = 0; k < len; k++) p.px(gx + k, Y(ceil) + gy + len - k, 'rgba(255,255,255,0.8)');
    if (gr() < 0.6) for (let k = 0; k < len - 1; k++) p.px(gx + k + 3, Y(ceil) + gy + len + 4 - k, 'rgba(255,255,255,0.5)');
  }
  for (let n = 0; n < 12; n++) p.px(3 + gr() * (w - 6), Y(ceil) + 6 + gr() * (floor - ceil - 9), 'rgba(235,250,255,0.7)');   // specks
  for (let i = 0; i <= w; i += 25) p.px(Math.min(i, w - 1), Y(ceil), '#e6e8e6', 1, floor - ceil);
  p.px(0, Y(ceil) + 5, '#e6e8e6', w, 1);                             // transom
  const hx = Math.round(w / 2 - 17);
  p.px(hx, Y(ceil) + 6, DM_GREEN, 34, 6);                             // the green header over the doors
  glyphs('BOTTLE-O', hx + 2, Y(ceil) + 6, 1, (x, y) => p.px(x, y, '#f4f6f1'));
  for (const px0 of [3, w - 15]) {                                    // lime "direct to boot" posters
    p.px(px0, Y(ceil) + 14, LIME, 12, 23);
    p.px(px0 + 2, Y(ceil) + 18, DM_DARK, 6, 2); p.px(px0 + 2, Y(ceil) + 22, DM_DARK, 8, 2); p.px(px0 + 2, Y(ceil) + 26, DM_DARK, 5, 2);
    for (let k = 0; k < 5; k++) p.px(px0 + 8 + (k < 3 ? k : 4 - k), Y(ceil) + 30 + k, DM_DARK);   // arrow
  }
  p.px(0, Y(roof), DM_DARK, 3, floor - roof);                         // corner pillars
  p.px(w - 3, Y(roof), DM_DARK, 3, floor - roof);
  p.px(0, Y(floor) - 3, '#d5d7d2', w, 3);                             // kick plate
  p.px(Math.round(w * 0.55), Y(ceil) - 2, '#9aa0a2', w - Math.round(w * 0.55), 3);   // awning
  p.px(Math.round(w * 0.55), Y(ceil) + 1, 'rgba(0,0,0,0.15)', w - Math.round(w * 0.55), 2);
  return { c: p.c, top };
}

// Pixel sprites for what falls out (and, at half size, the stock on the shelves):
// a Foster's can and a Johnnie Walker bottle
const LOOT_ART = {
  can: { rows: ['ssss', 'BBBB', 'BWRB', 'BRWB', 'BYYB', 'BBBB', 'ssss'], pal: { s: '#c9ccd0', B: '#1e56b5', W: '#f4f4f4', R: '#d22b2b', Y: '#e8c13a' } },
  bottle: { rows: ['.yy.', '.aa.', '.aa.', 'aaaa', 'aaaa', 'kkkk', 'kyyk', 'kkkk', 'aaaa', 'aaaa', 'AAAA'], pal: { y: '#e0b03a', a: '#b5651d', k: '#141414', A: '#7a4010' } }
};
const lootSprites = {};
for (const [name, art] of Object.entries(LOOT_ART)) {
  const c = makeCanvas(art.rows[0].length, art.rows.length), g = c.getContext('2d');
  art.rows.forEach((row, y) => [...row].forEach((ch, x) => { if (art.pal[ch]) { g.fillStyle = art.pal[ch]; g.fillRect(x, y, 1, 1); } }));
  lootSprites[name] = c;
}

const loot = [], bubbles = [];
const DRUNK_TIME = 10, ROLL_TIME = 0.55, LOOT_TIME = 4;

// Out the other side: bottles and cans tumble out of the door, and the magpie does a barrel roll and goes wobbly
function leaveShop(exitRight) {
  const ex = SHOP.x + (exitRight ? SHOP.w + 2 : -2), dir = exitRight ? 1 : -1;
  for (let i = 0; i < 9; i++)
    loot.push({ type: i % 3 ? 'can' : 'bottle', x: ex, y: 146 + Math.random() * 10, vx: dir * (30 + Math.random() * 70), vy: -40 - Math.random() * 60,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 14, rest: 162 + Math.random() * 6, life: LOOT_TIME });
  for (let i = 0; i < 9; i++) setTimeout(() => Sound.clink(), i * 70 + Math.random() * 40);
  bird.drunk = DRUNK_TIME;
  bird.roll = ROLL_TIME;
}

function updateShopAndDrunk(dt) {
  for (const l of loot) {
    l.life -= dt;
    if (l.y < l.rest || l.vy < 0) {
      l.vy += 320 * dt; l.x += l.vx * dt; l.y += l.vy * dt; l.rot += l.vr * dt;
      if (l.y >= l.rest && l.vy > 0) { if (!l.landed) { l.landed = true; Sound.clink(0.5); } l.y = l.rest; l.vy = Math.abs(l.vy) > 40 ? -l.vy * 0.3 : 0; l.vx *= 0.5; l.vr *= 0.5; }
    }
  }
  for (let i = loot.length - 1; i >= 0; i--) if (loot[i].life <= 0) loot.splice(i, 1);

  bird.roll = Math.max(0, bird.roll - dt);
  if (bird.drunk > 0) {
    bird.drunk = Math.max(0, bird.drunk - dt);
    if (!bird.grounded) {                                             // erratic flight
      bird.vx += (Math.sin(time * 2.3) * 140 + (Math.random() - 0.5) * 500) * dt;
      bird.vy += (Math.cos(time * 3.7) * 180 + (Math.random() - 0.5) * 500) * dt;
    }
    if (Math.random() < dt * 9)
      bubbles.push({ x: bird.x + bird.face * 7, y: bird.y - 5, vy: -14 - Math.random() * 14, r: 0.7 + Math.random() * 0.9, phase: Math.random() * 6, life: 1.6 });
  }
  for (const b of bubbles) { b.life -= dt; b.y += b.vy * dt; b.x += Math.sin(time * 5 + b.phase) * 6 * dt; }
  for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].life <= 0) bubbles.splice(i, 1);
}

function drawLootAndBubbles(g) {
  g.imageSmoothingEnabled = false;
  for (const l of loot) {
    const img = lootSprites[l.type];
    g.globalAlpha = Math.min(1, l.life / 1.5);
    g.setTransform(K, 0, 0, K, loopX(l.x) * K, l.y * K);
    g.rotate(l.rot);
    g.drawImage(img, -img.width / 2, -img.height / 2);
  }
  g.globalAlpha = 1;
  for (const b of bubbles) {
    g.setTransform(K, 0, 0, K, loopX(b.x) * K, b.y * K);
    g.globalAlpha = Math.min(1, b.life / 0.6);
    g.beginPath(); g.arc(0, 0, b.r, 0, Math.PI * 2);
    g.fillStyle = 'rgba(220,240,255,0.25)'; g.fill();
    g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 0.22; g.stroke();
    g.beginPath(); g.arc(-b.r * 0.35, -b.r * 0.35, b.r * 0.25, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill();
  }
  g.globalAlpha = 1;
  g.setTransform(1, 0, 0, 1, 0, 0);
}

// The shelf stock: rows of the bottle and can sprites at half size (half a scenery pixel each),
// built once at 4x and drawn on the smooth canvas under the magpie and the glass
const STOCK_RES = 4;
function buildShelfStock() {
  const { w, ceil, floor } = SHOP, c = makeCanvas(w * STOCK_RES, (floor - ceil) * STOCK_RES), g = c.getContext('2d'), r = rng(8);
  g.imageSmoothingEnabled = false;
  const put = (type, x, shelfY) => {
    const img = lootSprites[type], sw = img.width * STOCK_RES / 2, sh = img.height * STOCK_RES / 2;
    g.drawImage(img, Math.round(x * STOCK_RES), Math.round((shelfY - ceil) * STOCK_RES - sh), sw, sh);
  };
  for (const sy of SHELVES) for (let x = 4; x < w - 33; x += 2.5) put(r() < 0.7 ? 'bottle' : 'can', x, sy);
  for (const sy of FRIDGE_SHELVES) for (let x = w - 26; x < w - 6; x += 2.5) put('can', x, sy);
  return c;
}

// Draw a picture on the smooth canvas, smeared along the flight in a swoop like the scenery
function drawSmeared(g, img, x, y, w, h) {
  g.imageSmoothingEnabled = false;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(img, Math.round(x * K), Math.round(y * K), w * K, h * K);
  if (blur > 0.02) {
    const v = Math.hypot(bird.vx, bird.vy) || 1, step = 2.2 * blur;
    for (let i = 1; i <= 7; i++) {
      g.globalAlpha = 1 / (i + 1);
      g.drawImage(img, Math.round((x + bird.vx / v * step * i) * K), Math.round((y + bird.vy / v * step * i) * K), w * K, h * K);
    }
    g.globalAlpha = 1;
  }
}

function drawShelfStock(g) {
  drawSmeared(g, shelfStock, loopX(SHOP.x), SHOP.ceil, SHOP.w, SHOP.floor - SHOP.ceil);
}

// SWOOP-AND-POOP!: pop-art comic lettering in the Roy Lichtenstein style. A yellow starburst
// with red Ben-Day dots and a thick black outline, tilted red lettering with a black outline
// and offset shadow. It pops in, holds, then fades over its 1 second.
function drawCombo(g) {
  if (comboT <= 0) return;
  const age = COMBO_TIME - comboT, pop = age < 0.12 ? 0.3 + 0.85 * age / 0.12 : age < 0.2 ? 1.15 - (age - 0.12) / 0.08 * 0.15 : 1;
  g.save();
  g.setTransform(K * pop, 0, 0, K * pop, W / 2 * K, 52 * K);
  g.rotate(-0.12);
  g.globalAlpha = Math.min(1, comboT / 0.4);
  // starburst
  const burst = () => {
    g.beginPath();
    for (let i = 0; i < 28; i++) {
      const a = i / 28 * Math.PI * 2, r = i % 2 ? 40 : 58 + (i % 4 === 0 ? 8 : 0);
      g.lineTo(Math.cos(a) * r * 1.55, Math.sin(a) * r * 0.62);
    }
    g.closePath();
  };
  burst(); g.fillStyle = '#ffe414'; g.fill();
  g.save(); burst(); g.clip();                                     // Ben-Day dots
  g.fillStyle = '#ff4a3d';
  for (let y = -44; y <= 44; y += 4) for (let x = -96; x <= 96; x += 4) {
    const off = (y / 4) % 2 ? 2 : 0;
    g.beginPath(); g.arc(x + off, y, 0.95, 0, Math.PI * 2); g.fill();
  }
  g.restore();
  burst(); g.lineJoin = 'round'; g.lineWidth = 2.6; g.strokeStyle = '#111'; g.stroke();
  // lettering
  g.font = 'italic 900 19px Impact, "Arial Black", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const text = 'SWOOP-AND-POOP!';
  g.lineWidth = 5; g.strokeStyle = '#111';
  g.fillStyle = '#111'; g.fillText(text, 2.2, 2.6);                // offset shadow
  g.strokeText(text, 0, 0);
  g.fillStyle = '#e8232a'; g.fillText(text, 0, 0);
  g.lineWidth = 0.8; g.strokeStyle = '#fff4a0'; g.strokeText(text, -0.6, -0.6);   // a thin light edge on the letters
  g.restore();
}

function drawShopFront(g) {
  drawSmeared(g, shopFront.c, loopX(SHOP.x), shopFront.top, shopFront.c.width, shopFront.c.height);
}

// ---------------------------------------------------------------------------
// Sound, all made in code with Web Audio (no files): poop plop and splosh, cans and bottles
// clinking out of the BOTTLE-O, hiccups while drunk, a SWOOP-AND-POOP! sting, and a gentle
// suburban background of breeze, cicadas, distant birds and now and then a didgeridoo. It starts on the first key press
// or touch (browsers need that); M or the speaker icon mutes it, and the choice is remembered.
// ---------------------------------------------------------------------------
const Sound = (() => {
  let ac = null, master = null, noise = null, muted = false, hicT = 1, birdT = 3, cicadaT = 6, didgT = 8;
  try { muted = localStorage.getItem('swoopMuted') === '1'; } catch (e) { /* storage blocked: default on */ }

  function start() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    breeze();
    updateIcon();
  }

  // Building blocks
  const now = () => ac.currentTime;
  function env(gain, t, attack, hold, release, peak) {
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(peak, t + attack);
    gain.gain.setValueAtTime(peak, t + attack + hold);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + attack + hold + release);
  }
  function tone(type, f0, f1, t, dur, peak, dest = master) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    env(g, t, 0.005, 0, dur, peak);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }
  function burst(t, dur, filterType, freq, q, peak, dest = master) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; f.type = filterType; f.frequency.value = freq; f.Q.value = q;
    env(g, t, 0.004, 0, dur, peak);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }

  // Background: a breeze that comes and goes (looping filtered noise with slow wobbles)
  function breeze() {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noise; s.loop = true; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0.05;
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 0.03;
    const lfo2 = ac.createOscillator(), lg2 = ac.createGain(); lfo2.frequency.value = 0.05; lg2.gain.value = 250;
    lfo.connect(lg); lg.connect(g.gain); lfo2.connect(lg2); lg2.connect(f.frequency);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(); lfo.start(); lfo2.start();
  }
  // Cicadas: a pulsing high buzz that swells up and dies away
  function cicadas() {
    const t = now(), len = 4 + Math.random() * 3;
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), pulse = ac.createGain(), g = ac.createGain();
    s.buffer = noise; s.loop = true; f.type = 'bandpass'; f.frequency.value = 4800 + Math.random() * 800; f.Q.value = 9;
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.type = 'square'; lfo.frequency.value = 38 + Math.random() * 10; lg.gain.value = 0.5;
    pulse.gain.value = 0.5; lfo.connect(lg); lg.connect(pulse.gain);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.03, t + len * 0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(f); f.connect(pulse); pulse.connect(g); g.connect(master);
    s.start(t); lfo.start(t); s.stop(t + len + 0.1); lfo.stop(t + len + 0.1);
  }
  // A distant bird: a few quick, soft chirps
  function distantBird() {
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200; lp.connect(master);
    const base = 2000 + Math.random() * 1500;
    for (let i = 0, n = 2 + Math.floor(Math.random() * 4); i < n; i++) {
      const t = now() + i * (0.11 + Math.random() * 0.05), f = base * (0.9 + Math.random() * 0.3);
      tone('sine', f, f * (1.15 + Math.random() * 0.3), t, 0.07, 0.025, lp);
    }
  }

  // A didgeridoo, far off: a low buzzing drone with its 'wah' formants swaying and a breathing
  // pulse, fading in, playing a while and fading out
  function didgeridoo() {
    const t = now(), len = 9 + Math.random() * 6, f = 62 + Math.random() * 10, fade = 3;
    const out = ac.createGain();
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.16, t + fade);
    out.gain.setValueAtTime(0.16, t + len - fade); out.gain.exponentialRampToValueAtTime(0.0001, t + len);
    out.connect(master);
    const pulse = ac.createGain(); pulse.gain.value = 0.7; pulse.connect(out);
    const breath = ac.createOscillator(), bg = ac.createGain();
    breath.frequency.value = 1.8 + Math.random() * 0.8; bg.gain.value = 0.3; breath.connect(bg); bg.connect(pulse.gain);
    const body = ac.createBiquadFilter(); body.type = 'lowpass'; body.frequency.value = 320; body.connect(pulse);
    const formants = [[420, 5, 240, 0.55], [1150, 7, 420, 0.8]].map(([freq, q, sway, rate]) => {
      const b = ac.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = freq; b.Q.value = q;
      const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = rate; lg.gain.value = sway;
      lfo.connect(lg); lg.connect(b.frequency); lfo.start(t); lfo.stop(t + len + 0.1);
      const g = ac.createGain(); g.gain.value = 0.8; b.connect(g); g.connect(pulse);
      return b;
    });
    for (const detune of [1, 1.006]) {
      const o = ac.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * detune;
      o.connect(body); formants.forEach(b => o.connect(b));
      o.start(t); o.stop(t + len + 0.1);
    }
    breath.start(t); breath.stop(t + len + 0.1);
  }

  // Effects
  function plop() { const t = now(); tone('sine', 700, 180, t, 0.09, 0.25); }
  function splosh() {
    const t = now();
    burst(t, 0.28, 'lowpass', 900, 1, 0.45);
    tone('sine', 140, 60, t, 0.12, 0.35);
    burst(t + 0.03, 0.12, 'bandpass', 2500, 2, 0.1);
  }
  // A can or bottle: a few bright, inharmonic partials, quickly gone
  function clink(level = 1) {
    const t = now() + Math.random() * 0.02, f = 1800 + Math.random() * 2200;
    for (const [mul, peak] of [[1, 0.12], [2.76, 0.06], [5.4, 0.03]]) tone('triangle', f * mul, f * mul * 0.98, t, 0.12 + Math.random() * 0.1, peak * level);
  }
  function hic() {
    const t = now();
    tone('square', 280, 720, t, 0.07, 0.07);
    burst(t, 0.06, 'bandpass', 1200, 3, 0.12);
  }
  // SWOOP-AND-POOP!: a quick brassy two-chord stab
  function sting() {
    const t = now(), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600; lp.connect(master);
    [[[392, 494, 587], 0, 0.14], [[523, 659, 784], 0.16, 0.38]].forEach(([chord, at, dur]) => {
      for (const f of chord) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sawtooth'; o.frequency.value = f; env(g, t + at, 0.01, dur * 0.6, dur * 0.4, 0.06);
        o.connect(g); g.connect(lp); o.start(t + at); o.stop(t + at + dur + 0.05);
      }
    });
  }

  // Background events and hiccups, timed from the game loop
  function tick(dt) {
    if (!ac || muted) return;
    birdT -= dt; cicadaT -= dt;
    if (birdT <= 0) { distantBird(); birdT = 2 + Math.random() * 5; }
    if (cicadaT <= 0) { cicadas(); cicadaT = 9 + Math.random() * 8; }
    didgT -= dt;
    if (didgT <= 0) { didgeridoo(); didgT = 25 + Math.random() * 25; }
    if (bird.drunk > 0) { hicT -= dt; if (hicT <= 0) { hic(); hicT = 1.2 + Math.random() * 1.4; } }
    else hicT = 0.6;
  }

  function toggle() {
    start();
    muted = !muted;
    try { localStorage.setItem('swoopMuted', muted ? '1' : '0'); } catch (e) { /* not remembered */ }
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, now(), 0.05);
    updateIcon();
  }
  function updateIcon() {
    const b = document.getElementById('sound');
    b.classList.toggle('off', muted);
    b.title = muted ? 'Sound off (M)' : 'Sound on (M)';
  }
  const safe = fn => (...a) => { if (ac && !muted) fn(...a); };
  return { start, toggle, tick, updateIcon, isMuted: () => muted, plop: safe(plop), splosh: safe(splosh), clink: safe(clink), sting: safe(sting) };
})();

// ---------------------------------------------------------------------------
// Input: arrow keys or WASD, hold Space to swoop, P to poop; on touch screens, hold
// where you want to fly, tap quickly to start or stop a swoop, tap with a second finger to poop
// ---------------------------------------------------------------------------
const keys = { up: false, down: false, left: false, right: false, swoop: false };
const KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
let started = false, startedAt = 0, touch = null, touchAt = 0, touchSwoop = false, isTouch = false;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); keys.swoop = true; begin(); return; }
  if (e.code === 'KeyP') { if (!e.repeat) poop(); begin(); return; }
  if (e.code === 'KeyB') { if (!e.repeat) barrelRoll(); begin(); return; }
  if (e.code === 'KeyL') { if (!e.repeat) loopTheLoop(); begin(); return; }
  if (e.code === 'KeyM') { if (!e.repeat) Sound.toggle(); begin(); return; }
  const k = KEYMAP[e.code];
  if (k) { keys[k] = true; e.preventDefault(); begin(); }
});
addEventListener('keyup', e => { if (e.code === 'Space') keys.swoop = false; const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touch = null; });
function toInternal(e) {
  const rect = canvas.getBoundingClientRect(), s = Math.min(rect.width / W, rect.height / H);
  return { x: (e.clientX - rect.left - (rect.width - W * s) / 2) / s, y: (e.clientY - rect.top - (rect.height - H * s) / 2) / s };
}
document.getElementById('sound').addEventListener('click', e => { e.currentTarget.blur(); Sound.toggle(); begin(); });
let fingers = 0;
front.addEventListener('pointerdown', e => {
  isTouch = e.pointerType !== 'mouse';
  if (++fingers > 1) { poop(); return; }                          // a second finger poops
  touch = toInternal(e); touchAt = performance.now(); front.setPointerCapture(e.pointerId); begin();
});
front.addEventListener('pointermove', e => { if (touch) touch = toInternal(e); });
front.addEventListener('pointerup', () => { fingers = Math.max(0, fingers - 1); if (fingers) return; if (performance.now() - touchAt < 180) touchSwoop = !touchSwoop; touch = null; });
front.addEventListener('pointercancel', () => { fingers = Math.max(0, fingers - 1); if (!fingers) touch = null; });
function begin() { Sound.start(); if (!started) { started = true; startedAt = time; } }

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
// Swooping: fast flight while Space is held. The charge bar empties in 3 seconds of
// swooping and takes 10 seconds to fill again. Up and down tilt the magpie 30 degrees.
const SWOOP_SPEED = 330, SWOOP_DRAIN = 1 / 3, SWOOP_RECHARGE = 1 / 10, TILT = Math.PI / 6;
const bird = { x: 120, y: 90, vx: 0, vy: 0, face: 1, grounded: false, flapT: 0, walkT: 0, pitch: 0, swooping: false, spent: false, charge: 1, poop: 1, inside: false, wasIn: false, drunk: 0, roll: 0, loopT: 0, loop: null };

// Stunts: B for a barrel roll (a full turn about his body), L for a loop-the-loop
// (a full vertical circle, carrying on forward as he goes round)
const LOOP_TIME = 1.1, LOOP_R = 22;
function barrelRoll() {
  if (bird.roll <= 0) bird.roll = ROLL_TIME;
}
function loopTheLoop() {
  if (bird.loopT > 0 || bird.inside) return;                      // no room under the shop ceiling
  bird.swooping = false;
  bird.grounded = false;
  const y0 = Math.max(bird.y, TOP_Y + 2 * LOOP_R);                  // keep the top of the loop on screen
  bird.loop = { x: bird.x, y: y0, vx: Math.abs(bird.vx) > 30 ? bird.vx : bird.face * 60, face: bird.face };
  bird.loopT = LOOP_TIME;
}

// Pooping: P drops a white teardrop. It takes a full poop bar, which fills at half the
// swoop bar's speed (20 seconds). Drops splosh on whatever they hit: the lawn for now;
// targets (people, say) can be added to TARGETS later.
const POOP_RECHARGE = SWOOP_RECHARGE / 2, DROP_GRAVITY = 320;
const TARGETS = [];               // { x, y, w, h, hit(drop) } in world pixels
const drops = [], sploshes = [], splashes = [];

let comboT = 0;                   // seconds left on the SWOOP-AND-POOP! flash
const COMBO_TIME = 1;

function poop() {
  if (bird.poop < 1) return;
  bird.poop = 0;
  Sound.plop();
  if (bird.swooping) { comboT = COMBO_TIME; Sound.sting(); }
  drops.push({ x: bird.x - bird.face * 10, y: bird.y + 3, vx: bird.vx * 0.7, vy: Math.max(bird.vy, 0) * 0.7 + 15 });
}

function splosh(x, y) {
  const r = rng(Math.floor(x * 7 + y * 13));
  const blobs = [{ dx: 0, dy: 0, rx: 3.2, ry: 1.1 }];
  for (let i = 0; i < 6; i++) blobs.push({ dx: (r() - 0.5) * 11, dy: (r() - 0.5) * 2, rx: 0.4 + r() * 0.8, ry: 0.3 + r() * 0.4 });
  sploshes.push({ x, y, blobs, born: time });
  Sound.splosh();
  if (sploshes.length > 30) sploshes.shift();
  for (let i = 0; i < 7; i++) splashes.push({ x, y, vx: (r() - 0.5) * 90, vy: -30 - r() * 50, life: 0.45 });
}

function updateDrops(dt) {
  for (const d of drops) {
    d.vy += DROP_GRAVITY * dt;
    d.x += d.vx * dt; d.y += d.vy * dt;
    const target = TARGETS.find(t => d.x > t.x && d.x < t.x + t.w && d.y > t.y && d.y < t.y + t.h);
    if (target) { d.done = true; target.hit(d); splosh(d.x, d.y); }
    else if (d.y >= LAND_Y + 1) { d.done = true; splosh(d.x, LAND_Y + 1); }
  }
  for (let i = drops.length - 1; i >= 0; i--) if (drops[i].done) drops.splice(i, 1);
  for (const sp of splashes) { sp.vy += DROP_GRAVITY * dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt; sp.life -= dt; }
  for (let i = splashes.length - 1; i >= 0; i--) if (splashes[i].life <= 0) splashes.splice(i, 1);
}
let cam = bird.x - SCREEN * 0.42, time = 0, distance = 0, lap = 1, lapFlash = 0;
const trail = [];
let blur = 0;                     // 0 to 1: how much the screen is smeared by a swoop
let sunHi, clouds, hills, backStreets, suburb, ground, shopFront, shelfStock;

function controls() {
  const c = { ...keys };
  if (bird.drunk > 0 && Math.sin(time * 1.3) > 0.55) [c.left, c.right] = [c.right, c.left];   // drunk: left and right swap now and then
  if (touch) {
    const dx = touch.x - (bird.x - cam), dy = touch.y - bird.y;
    if (dx < -8) c.left = true; if (dx > 8) c.right = true;
    if (dy < -8) c.up = true; if (dy > 8) c.down = true;
  }
  return c;
}

function update(dt) {
  time += dt;
  const c = controls(), dirX = (c.right ? 1 : 0) - (c.left ? 1 : 0), dirY = (c.down ? 1 : 0) - (c.up ? 1 : 0), x0 = bird.x;
  if (dirX) bird.face = dirX;

  // Start a swoop with a little charge in the bar; keep going until let go or empty
  const wantSwoop = keys.swoop || touchSwoop;
  if (!wantSwoop) bird.spent = false;                               // after running dry, let go of Space before the next swoop
  if (wantSwoop && !bird.swooping && !bird.spent && bird.loopT <= 0 && bird.charge > 0.05) { bird.swooping = true; bird.grounded = false; }
  if (bird.swooping && bird.charge <= 0) { bird.spent = true; touchSwoop = false; }
  if (!wantSwoop || bird.spent) bird.swooping = false;
  bird.charge = clamp(bird.charge + (bird.swooping ? -SWOOP_DRAIN : SWOOP_RECHARGE) * dt, 0, 1);
  bird.poop = Math.min(1, bird.poop + POOP_RECHARGE * dt);
  updateDrops(dt);
  updateShopAndDrunk(dt);
  const floor = (shopSpan(bird.x) && !bird.inside ? SHOP.roof : LAND_Y) - FEET;   // on the shop roof, or the lawn
  if (bird.grounded && bird.y < floor - 0.5) bird.grounded = false;                // walked off the roof

  if (bird.swooping) {
    // Swoop: straight and fast; up or down angles the dive 30 degrees
    const a = dirY * TILT;
    bird.vx = bird.face * SWOOP_SPEED * Math.cos(a);
    bird.vy = SWOOP_SPEED * Math.sin(a);
    bird.y += bird.vy * dt;
    if (bird.y < TOP_Y) bird.y = TOP_Y;
    if (bird.y > floor) bird.y = floor;                              // skims along the lawn (or the roof)
  } else if (bird.grounded) {
    bird.vx = dirX * WALK;
    if (dirX) bird.walkT += dt;
    if (c.up) { bird.grounded = false; bird.vy = -60; }
  }
  if (!bird.grounded && !bird.swooping) {
    const maxX = c.down ? MAX_X_DIVE : MAX_X;
    if (Math.abs(bird.vx) > maxX) bird.vx += (Math.sign(bird.vx) * maxX - bird.vx) * Math.min(1, 2 * dt);  // ease back after a swoop
    else if (dirX) bird.vx = clamp(bird.vx + dirX * ACCEL_X * dt, -maxX, maxX);
    else bird.vx *= Math.exp(-0.8 * dt);                           // glide keeps most of its speed
    bird.vy += (GRAVITY - (c.up ? FLAP : 0) + (c.down ? DIVE : 0)) * dt;
    const maxDown = c.down ? MAX_DIVE : MAX_FALL;
    if (bird.vy > maxDown) bird.vy += (maxDown - bird.vy) * Math.min(1, 6 * dt);  // ease to falling speed
    bird.vy = Math.max(bird.vy, -MAX_CLIMB);
    bird.y += bird.vy * dt;
    if (bird.y < TOP_Y) { bird.y = TOP_Y; bird.vy = Math.max(0, bird.vy); }
    if (bird.y >= floor) { bird.y = floor; bird.vy = 0; bird.grounded = true; bird.walkT = 0; }
  }
  if (!bird.grounded) bird.flapT += dt * (bird.swooping ? 0 : c.up ? 14 : dirX ? 8 : 0);
  bird.x += bird.vx * dt;
  distance += Math.abs(bird.x - x0);

  // The bottle shop: come in from the side below the roof line and you're inside, under the
  // ceiling; leave by either side and the fun starts
  const nowIn = shopSpan(bird.x);
  if (nowIn && !bird.wasIn) bird.inside = bird.y > SHOP.roof - 2;
  if (!nowIn && bird.wasIn && bird.inside) { bird.inside = false; leaveShop(mod(bird.x - SHOP.x, LEVEL_W) < LEVEL_W / 2); }
  if (nowIn && bird.inside && bird.y < SHOP.ceil + 7) { bird.y += (SHOP.ceil + 7 - bird.y) * Math.min(1, 12 * dt); bird.vy = Math.max(0, bird.vy); }
  bird.wasIn = nowIn;

  // Up and down tilt the magpie 30 degrees; it eases between angles
  const targetPitch = bird.grounded ? 0 : dirY * TILT;
  bird.pitch += (targetPitch - bird.pitch) * Math.min(1, 8 * dt);

  if (bird.loopT > 0) {                                            // loop-the-loop: round a circle, nose along it
    bird.loopT = Math.max(0, bird.loopT - dt);
    const L = bird.loop, t = 1 - bird.loopT / LOOP_TIME, th = t * Math.PI * 2, el = t * LOOP_TIME;
    bird.x = L.x + L.vx * el * 0.6 + L.face * LOOP_R * Math.sin(th);
    bird.y = L.y - LOOP_R + LOOP_R * Math.cos(th);
    bird.vx = L.vx; bird.vy = 0; bird.face = L.face;
    bird.pitch = -th;
    bird.flapT += dt * 14;
    if (bird.loopT === 0) bird.pitch = 0;
  }

  const newLap = Math.floor(bird.x / LEVEL_W) + 1;
  if (newLap > lap) { lap = newLap; lapFlash = 1.6; }
  lapFlash = Math.max(0, lapFlash - dt);

  // Speed streaks when going fast
  const speed = Math.hypot(bird.vx, bird.vy);
  if (speed > 120 && Math.random() < dt * 50) trail.push({ x: bird.x - bird.face * 8, y: bird.y + (Math.random() - 0.5) * 8, life: 0.35 });
  for (const t of trail) t.life -= dt;
  while (trail.length && trail[0].life <= 0) trail.shift();

  blur += ((bird.swooping ? 1 : 0) - blur) * Math.min(1, (bird.swooping ? 6 : 3) * dt);
  comboT = Math.max(0, comboT - dt);
  Sound.tick(dt);

  const target = bird.x - W * 0.42 + bird.face * W * 0.06 + clamp(bird.vx * 0.25, -60, 60);
  cam += (target - cam) * Math.min(1, 3 * dt);
}

function magpiePose() {
  const pose = basePose();
  pose.roll = bird.roll > 0 ? (1 - bird.roll / ROLL_TIME) * Math.PI * 2 : 0;    // barrel roll: a full turn about his body
  pose.drunk = bird.drunk > 0;
  if (pose.drunk) pose.pitch += Math.sin(time * 7) * 0.18;
  return pose;
}

function basePose() {
  const c = controls();
  if (bird.grounded) {
    const walking = bird.vx !== 0;
    return { pitch: -0.35, headPitch: 0.3, wings: 'folded', legs: walking ? bird.walkT * 14 : 0, bob: walking ? -Math.abs(Math.sin(bird.walkT * 14)) * 1.5 : 0 };
  }
  const flapping = c.up || c.left || c.right || bird.loopT > 0;
  return {
    pitch: bird.pitch, headPitch: -bird.pitch * 0.3,
    wings: bird.swooping ? 'folded' : flapping ? 0.2 + 0.8 * Math.sin(bird.flapT * Math.PI / 2) : 0.35,
    legs: null, bob: 0, burn: blur, dangle: bird.swooping
  };
}

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
const scene = makeCanvas(SCREEN, H), sctx = scene.getContext('2d');   // the scenery, before any swoop blur
function drawTiled(img, P, offset, y = 0) {
  for (let x = -mod(Math.round(offset), P); x < W; x += P) sctx.drawImage(img, x, y);
}

// A charge bar under the lap counter (swoop, then poop); it flashes when full
function drawBar(label, x, y, value, colour, fullColour, active, hint) {
  const full = value >= 1, bw = 40, bx = x + textWidth('SWOOP') + 4;
  drawText('- ' + hint, bx + bw + 4, y, '#ffffff');                // which key to press
  drawText(label, x, y, full || active ? fullColour : '#ffffff');
  ctx.fillStyle = '#18222e'; ctx.fillRect(bx - 1, y - 1, bw + 2, 7);
  ctx.fillStyle = '#3c4a5a'; ctx.fillRect(bx, y, bw, 5);
  ctx.fillStyle = active ? '#ff9a3c' : full && Math.floor(time * 3) % 2 ? fullColour : colour;
  ctx.fillRect(bx, y, Math.round(bw * value), 5);
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(bx, y, Math.round(bw * value), 1);
}

// Screen x of a world position, allowing for the level looping round
const loopX = x => { let sx = mod(x - cam, LEVEL_W); if (sx > W + 40) sx -= LEVEL_W; return sx; };

// Falling drops (white teardrops, pointing back along their fall), sploshes and splashes, on the smooth canvas
function drawPoop(g) {
  for (const s of sploshes) {
    const sx = loopX(s.x), grow = Math.min(1, (time - s.born) / 0.08);
    g.setTransform(K * 1.5, 0, 0, K * 1.5, sx * K, s.y * K);
    for (const b of s.blobs) {
      g.beginPath(); g.ellipse(b.dx * grow, b.dy, b.rx * grow, b.ry, 0, 0, Math.PI * 2);
      g.fillStyle = '#f6f6f2'; g.fill();
      g.strokeStyle = 'rgba(120,130,110,0.35)'; g.lineWidth = 0.2; g.stroke();
    }
    g.beginPath(); g.ellipse(-0.8, -0.3, 1.2, 0.35, 0, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill();
  }
  g.fillStyle = '#f6f6f2';
  for (const sp of splashes) {
    g.setTransform(K, 0, 0, K, loopX(sp.x) * K, sp.y * K);
    g.globalAlpha = Math.min(1, sp.life / 0.2);
    g.beginPath(); g.arc(0, 0, 0.6, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;
  for (const d of drops) {
    g.setTransform(K * 1.4, 0, 0, K * 1.4, loopX(d.x) * K, d.y * K);
    g.rotate(Math.atan2(d.vy, d.vx) - Math.PI / 2);
    g.beginPath();
    g.moveTo(0, -3.4); g.bezierCurveTo(1.1, -1.7, 1.8, -0.2, 1.8, 0.8);
    g.arc(0, 0.8, 1.8, 0, Math.PI); g.bezierCurveTo(-1.8, -0.2, -1.1, -1.7, 0, -3.4);
    const gr = g.createRadialGradient(-0.6, 0.2, 0.2, 0, 0.6, 2.2);
    gr.addColorStop(0, '#ffffff'); gr.addColorStop(1, '#d9dde0');
    g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(60,70,80,0.35)'; g.lineWidth = 0.25; g.stroke();
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
}

function draw() {
  // Back canvas: the pixel sky scaled up, then the smooth sun.
  // The sun is slowest of all: it takes SUN_LOOPS trips round the level to cross the screen.
  bctx.imageSmoothingEnabled = false;
  bctx.drawImage(skyCanvas, 0, 0, back.width, back.height);
  const span = W + SUN_SIZE, sunX = mod(W * 0.62 - cam * span / (SUN_LOOPS * LEVEL_W) + SUN_SIZE, span) - SUN_SIZE;
  bctx.imageSmoothingEnabled = true; bctx.imageSmoothingQuality = 'high';
  bctx.filter = blur > 0.02 ? 'blur(' + (blur * K * 1.2).toFixed(1) + 'px)' : 'none';   // the sun blurs in a swoop too
  const glow = bctx.createRadialGradient((sunX + SUN_SIZE / 2) * K, (8 + SUN_SIZE / 2) * K, 0, (sunX + SUN_SIZE / 2) * K, (8 + SUN_SIZE / 2) * K, SUN_SIZE * 0.75 * K);
  glow.addColorStop(0, 'rgba(255,236,170,0.55)'); glow.addColorStop(1, 'rgba(255,236,170,0)');
  bctx.fillStyle = glow; bctx.fillRect((sunX - SUN_SIZE / 2) * K, (8 - SUN_SIZE / 2) * K, SUN_SIZE * 2 * K, SUN_SIZE * 2 * K);
  if (sunHi.complete) bctx.drawImage(sunHi, (sunX + SUN_SIZE * (1 - SUN_ASPECT) / 2) * K, 8 * K, SUN_SIZE * SUN_ASPECT * K, SUN_SIZE * K);
  bctx.filter = 'none';


  // Pixel canvas: clouds, hills, suburb, lawn
  sctx.clearRect(0, 0, W, H);
  for (const cl of clouds) sctx.drawImage(cl.img, Math.round(cl.u * W - cl.img.width / 2), cl.y);
  drawTiled(hills.c, hills.P, cam * PARALLAX.hills, -HILLS_LIFT);
  for (let i = backStreets.length - 1; i >= 0; i--) drawTiled(backStreets[i].c, backStreets[i].P, cam * backStreets[i].f);
  drawTiled(suburb.c, suburb.P, cam * PARALLAX.suburb);
  drawTiled(ground.c, ground.P, cam * PARALLAX.ground);
  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(scene, 0, 0);
  if (blur > 0.02) {                                   // swoop blur: smear the scenery along the flight
    const v = Math.hypot(bird.vx, bird.vy) || 1, step = 2.2 * blur;
    for (let i = 1; i <= 7; i++) {
      ctx.globalAlpha = 1 / (i + 1);
      ctx.drawImage(scene, Math.round(bird.vx / v * step * i), Math.round(bird.vy / v * step * i));
    }
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = '#ffffff';
  for (const t of trail) {
    ctx.globalAlpha = t.life / 0.35;
    ctx.fillRect(Math.round(t.x - cam - bird.face * 3), Math.round(t.y), 4, 1);
  }
  ctx.globalAlpha = 1;

  drawText('LAP ' + lap + '   ' + Math.floor(distance / 4) + ' M', 4, 4, '#ffffff');
  drawBar('SWOOP', 4, 12, bird.charge, '#ffd23f', '#fff3a0', bird.swooping, isTouch ? 'QUICK TAP' : 'SPACE BAR');
  drawBar('POOP', 4, 20, bird.poop, '#e9ece6', '#ffffff', false, isTouch ? 'SECOND FINGER' : 'P KEY');
  const hintX = 4 + textWidth('SWOOP') + 4 + 40 + 4;               // lines up with the bars' key hints
  drawText('BARREL ROLL', 4, 28, bird.roll > 0 ? '#ffe066' : '#ffffff'); drawText('- B KEY', hintX, 28, '#ffffff');
  drawText('LOOP-DE-LOOP', 4, 36, bird.loopT > 0 ? '#ffe066' : '#ffffff'); drawText('- L KEY', hintX, 36, '#ffffff');
  drawText(Sound.isMuted() ? 'SOUND OFF' : 'SOUND ON', 4, 44, '#ffffff'); drawText('- M KEY', hintX, 44, '#ffffff');
  if (lapFlash > 0 && Math.floor(lapFlash * 6) % 2 === 0) drawTextCentred('LAP ' + lap + '!', 60, '#ffe066', 3);
  const titleAlpha = started ? clamp(1 - (time - startedAt - 2), 0, 1) : 1;
  if (titleAlpha > 0) {
    ctx.globalAlpha = titleAlpha;
    drawTextCentred('SWOOPING SIMULATOR', 36, '#ffffff', 2);
    drawTextCentred(isTouch ? 'HOLD WHERE TO FLY - TAP TO SWOOP' : 'ARROW KEYS OR WASD TO FLY', 56, '#ffe066');
    drawTextCentred(isTouch ? 'SECOND FINGER TO POOP' : 'UP TO FLAP - HOLD SPACE TO SWOOP - P TO POOP', 64, '#ffe066');
    ctx.globalAlpha = 1;
  }

  // Front canvas: the smooth magpie
  fctx.setTransform(1, 0, 0, 1, 0, 0);
  fctx.clearRect(0, 0, front.width, front.height);
  drawPoop(fctx);
  drawShelfStock(fctx);
  if (!bird.inside) drawShopFront(fctx);                         // outside: the shop is behind him
  const pose = magpiePose();
  // A barrel roll corkscrews: he swings up and round the line of flight, smaller on the far side
  const ra = pose.roll || 0, cork = Math.sin(ra) * 8, depth = 1 - 0.18 * (1 - Math.cos(ra)) / 2;
  const sc = K * BIRD_SCALE * depth;
  fctx.setTransform(sc * bird.face, 0, 0, sc, (bird.x - cam - bird.face * cork * 0.3) * K, (bird.y - cork + pose.bob * BIRD_SCALE) * K);
  drawMagpie(fctx, pose);
  if (bird.inside) drawShopFront(fctx);                          // inside: we see him through the glass
  drawLootAndBubbles(fctx);
  drawCombo(fctx);
}

// ---------------------------------------------------------------------------
// Setup and main loop
// ---------------------------------------------------------------------------
function resize() {
  W = clamp(Math.round(H * innerWidth / innerHeight), 240, 480);
  canvas.width = scene.width = W; canvas.height = H;
  ctx.imageSmoothingEnabled = false;
  K = Math.max(1, Math.min(innerWidth / W, innerHeight / H) * (devicePixelRatio || 1));
  back.width = front.width = Math.round(W * K);
  back.height = front.height = Math.round(H * K);
  buildSky();
}

sunHi = loadSun();
clouds = buildClouds();
hills = buildHills();
backStreets = BACK_STREETS.map(buildBackStreet);
suburb = buildSuburb();
ground = buildGround();
shopFront = buildShopFront();
shelfStock = buildShelfStock();
resize();
addEventListener('resize', resize);
isTouch = matchMedia('(pointer: coarse)').matches;
Sound.updateIcon();

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
