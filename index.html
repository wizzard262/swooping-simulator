<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Swooping Simulator</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; object-fit: contain; object-position: center; }
  #game { image-rendering: crisp-edges; image-rendering: pixelated; }
  #prompts, #shots, #ver {
    position: fixed; right: 6px;
    font: 10px/1 monospace; color: rgba(255, 255, 255, .75);
    text-decoration: none; text-shadow: 0 1px 2px rgba(0, 0, 0, .6);
  }
  /* bottom right, out of the way of the score at the top right */
  #prompts { bottom: 59px; }
  #shots { bottom: 46px; }
  #ver { bottom: 33px; color: rgba(255, 255, 255, .55); pointer-events: none; }
  #sound {
    position: fixed; bottom: 5px; right: 5px; width: 22px; height: 22px; padding: 2px;
    border: 0; border-radius: 4px; background: rgba(0, 0, 0, .25); cursor: pointer;
  }
  #sound:hover { background: rgba(0, 0, 0, .45); }
  #sound .waves { stroke: #fff; }
  #sound.off .waves { display: none; }
  #sound .cross { display: none; stroke: #fff; }
  #sound.off .cross { display: inline; }
  #prompts:hover, #shots:hover { color: #fff; text-decoration: underline; }
  /* The objectives list: a window over the game (O, Start, or the link under the timer) */
  #objectives { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, .55); z-index: 10; }
  #objectives[hidden] { display: none; }
  #objectives .panel { position: relative; width: min(1180px, 96vw); max-height: 94vh; overflow: auto; box-sizing: border-box; padding: 12px 16px;
    background: #12202e; border: 3px solid #ffd23f; border-radius: 6px; box-shadow: 0 6px 30px rgba(0, 0, 0, .6);
    color: #e8eef4; font: min(14px, 2.1vh, 1.25vw)/1.3 Consolas, 'Courier New', monospace; }
  #objCols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 22px; align-items: start; }   /* two columns, so they all fit without scrolling; rows the same height in both */
  #objectives .num { width: 1.6em; text-align: right; color: #5d7088; }
  #objectives h2 { margin: 0 0 2px; color: #ffd23f; font-size: 1.45em; letter-spacing: 1px; }
  #objTime { margin: 0 0 10px; color: #9fdcff; }
  #objectives table { width: 100%; border-collapse: collapse; }
  #objectives td { padding: 3px 6px; border-top: 1px solid #23364a; vertical-align: top; }
  #objectives .tick { width: 1.4em; text-align: center; color: #5d7088; font-size: 1.15em; }
  #objectives tr.done .tick { color: #5fd35f; }
  #objectives .name { color: #ff7a6a; font-weight: bold; white-space: nowrap; }
  #objectives tr.done .name { color: #ffe066; }
  #objectives .what { color: #c9d4de; white-space: nowrap; }   /* short enough to stay on one line */
  #objectives .hint { margin: 8px 0 0; color: #7f93a8; font-size: .85em; }
  #objClose { position: absolute; top: 6px; right: 10px; background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
</style>
</head>
<body>
<!-- Three canvases, one on top of the other: sky and sun (smooth), the pixel-art scenery, the magpie (smooth) -->
<canvas id="back"></canvas>
<canvas id="game"></canvas>
<canvas id="front"></canvas>
<a id="prompts" href="prompts.html" target="_blank" rel="noopener">prompts</a>
<a id="shots" href="screenshots.html" target="_blank" rel="noopener">screenshots</a>
<div id="ver" title="Version: one for each update published">v86</div>
<button id="sound" title="Sound (M)" aria-label="Sound on or off (M)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke-width="2" stroke-linecap="round">
  <path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff" stroke="#fff"/><path class="waves" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/>
  <path class="cross" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
<div id="objectives" hidden>
  <div class="panel" role="dialog" aria-labelledby="objTitle">
    <button id="objClose" aria-label="Close">&times;</button>
    <h2 id="objTitle">OBJECTIVES <span id="objCount"></span></h2>
    <p id="objTime"></p>
    <div id="objCols"></div>
    <p class="hint">Press any key to exit</p>
  </div>
</div>
<!-- The game's JavaScript, in order. Plain scripts (not modules), so the page also runs straight
     from the file, with no web server: each file can use what the files before it define. -->
<script src="js/sun-image.js"></script>
<script src="js/data.js"></script>
<script src="js/helpers.js"></script>
<script src="js/sound.js"></script>
<script src="js/scenery.js"></script>
<script src="js/magpie.js"></script>
<script src="js/shop.js"></script>
<script src="js/cast.js"></script>
<script src="js/game.js"></script>
<script src="js/objectives.js"></script>
<script src="js/draw.js"></script>
<script src="js/main.js"></script>
</body>
</html>
